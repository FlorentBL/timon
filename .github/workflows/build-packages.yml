# Builds the desktop packages of one commit on Linux, macOS and Windows, for
# the workflow that calls it. Two callers, one set of build steps, so the
# nightly build exercises what a release runs (runners, toolchain, workspace
# clean-up, package build) and a break shows up the night it lands, not on the
# day of a release:
#
#   release.yml  purpose `release`: the final version main carries, channel
#                stable, no expiry, the daemon signed with the Ed25519 release
#                pair of the `release-build` environment, which the caller
#                passes through `secrets:` and the environment resolves.
#   nightly.yml  purpose `nightly`: x.y.z-nightly.YYYYMMDD, channel beta, a
#                short expiry, signed with a pair made on the runner
#                (scripts/release/throwaway-keys.mjs), in the `nightly-build`
#                environment, which holds no secret. Published nowhere.
#
# The purpose decides the channel, the expiry rule, the environment and the
# signing: a caller cannot ask for a stable build signed with a throwaway pair,
# nor a nightly in the release environment.
#
# The macOS builds run on the project's own Mac, shared by both callers. Its
# leg holds the `timon-mac-runner` concurrency group: a release leg cancels a
# nightly leg in progress, a nightly leg waits for a release leg. The org
# runner group `release-mac` must list this file (jobs defined in a reusable
# workflow are matched by the file that defines them, not by the caller).
#
# Every value reaches a script through an environment variable, never pasted
# into it: `${{ }}` inside `run:` would turn a value into shell code.
name: Build packages

on:
  workflow_call:
    inputs:
      purpose:
        description: release or nightly
        required: true
        type: string
      version:
        description: The version written into the packages (x.y.z for a release, x.y.z-nightly.YYYYMMDD for a nightly)
        required: true
        type: string
      sha:
        description: The full commit sha to build
        required: true
        type: string
      node:
        description: The Node version the packaged daemon runs on (desktop/scripts/node-runtime.json)
        required: true
        type: string
      expires:
        description: Expiry, an ISO 8601 date, or never (a release only)
        required: false
        type: string
        default: never
      fail-fast:
        description: Stop the other systems when one fails
        required: true
        type: boolean
      retention-days:
        description: How long the installers stay as artifacts of the run
        required: true
        type: number
    secrets:
      TIMON_RELEASE_PRIVATE_KEY:
        required: false
      TIMON_RELEASE_PUBLIC_KEY:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build · ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.purpose == 'release' && 'release-build' || 'nightly-build' }}
    timeout-minutes: 150
    permissions:
      contents: read
    concurrency:
      group: ${{ matrix.os == 'mac' && 'timon-mac-runner' || format('build-packages-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.os) }}
      cancel-in-progress: ${{ inputs.purpose == 'release' }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        # macOS: Apple Silicon only, as the release candidates.
        include:
          # Pinned: Ubuntu 26.04 builds its musl for x86-64-v3, and the fence
          # launcher must run on a baseline x86-64 CPU (24.04 musl is baseline).
          - { os: linux, runner: ubuntu-24.04 }
          # macOS builds run on the project's own Mac (org runner group
          # `release-mac`): hosted macOS arm64 runners were not acquired
          # under capacity limits.
          - { os: mac, runner: [self-hosted, macOS, ARM64, timon-release] }
          - { os: windows, runner: windows-latest }
    steps:
      # Refused here rather than an hour later: an unknown purpose, a version
      # of the wrong form for it, an expiry the purpose forbids.
      - name: Check the request
        env:
          PURPOSE: ${{ inputs.purpose }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
          EXPIRES: ${{ inputs.expires }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full commit id"; exit 1; }
          core='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          case "$PURPOSE" in
            release)
              [[ "$VERSION" =~ ^$core$ ]] || { echo "::error::a release builds a final version x.y.z"; exit 1; }
              [ "$EXPIRES" = never ] || { echo "::error::a release never expires"; exit 1; }
              ;;
            nightly)
              [[ "$VERSION" =~ ^$core-nightly\.[1-9][0-9]{7}$ ]] || { echo "::error::a nightly builds x.y.z-nightly.YYYYMMDD"; exit 1; }
              [[ "$EXPIRES" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::a nightly expires on a date"; exit 1; }
              ;;
            *) echo "::error::purpose must be release or nightly"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          path: src
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node }}
          cache: npm
          cache-dependency-path: |
            src/orchestrator/package-lock.json
            src/app/package-lock.json
            src/desktop/package-lock.json

      # A pair other than the pinned one would give packages whose updates no
      # installed Timon accepts: stop before an hour of build. Once is enough,
      # the pair is the same everywhere, and fail-fast stops the other systems.
      - name: Check the signing key is the one the clients pin
        if: matrix.os == 'linux' && inputs.purpose == 'release'
        working-directory: src
        env:
          TIMON_RELEASE_PUBLIC_KEY: ${{ secrets.TIMON_RELEASE_PUBLIC_KEY }}
        run: |
          node --input-type=module -e '
            import { join } from "node:path";
            import { pathToFileURL } from "node:url";
            const load = (file) => import(pathToFileURL(join(process.cwd(), ...file.split("/"))).href);
            const { keyIdFor } = await load("scripts/release-manifest.mjs");
            const { readPinnedKeyIds } = await load("scripts/release/publish.mjs");
            const pinned = readPinnedKeyIds(process.cwd()).ed25519;
            let id = null;
            try { id = keyIdFor(process.env.TIMON_RELEASE_PUBLIC_KEY); } catch { id = null; }
            if (!id || id !== pinned) {
              console.error(`::error::the release-build public key is ${id ?? "missing or unreadable"}, the clients pin ${pinned}`);
              process.exit(1);
            }
            console.log(`release key ${id}, pinned by the clients`);
          '

      # A nightly holds no release key: the daemon is signed with a pair made
      # here, outside the checkout, so the package starts and checks itself.
      - name: Throwaway signing keys
        if: inputs.purpose == 'nightly'
        run: node src/scripts/release/throwaway-keys.mjs "$RUNNER_TEMP"

      # The fence launcher is a static binary: built against the runner's glibc it
      # carries that libc's AVX code paths and dies with SIGILL on CPUs without
      # AVX2. musl targets the x86-64 baseline; its compiler only needs the
      # kernel's headers (Landlock, seccomp) made visible.
      - name: Install a baseline C library for the fence launcher
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools linux-libc-dev binutils
          musl_include=/usr/include/x86_64-linux-musl
          sudo ln -sfn /usr/include/linux "$musl_include/linux"
          sudo ln -sfn /usr/include/asm-generic "$musl_include/asm-generic"
          sudo ln -sfn /usr/include/x86_64-linux-gnu/asm "$musl_include/asm"
          x86_64-linux-musl-gcc --version | head -n 1

      # What the Linux build calls by name, checked before an hour of build:
      # objdump for the baseline check of the fence launcher, the compilers,
      # docker for the native modules rebuilt in the manylinux image. A runner
      # image that drops one fails here, in a second.
      - name: Check the Linux build tools
        if: matrix.os == 'linux'
        run: for tool in objdump gcc x86_64-linux-musl-gcc docker; do command -v "$tool" >/dev/null || { echo "::error::$tool is missing on this runner"; exit 1; }; done

      # A self-hosted runner (the Mac) keeps its workspace between runs, and the
      # build never overwrites installers: a run started again for the same
      # version would stop on the output of the one before. Hosted runners
      # start empty. This version and this system are cleared, and so is every
      # earlier nightly, whose installers are artifacts already.
      - name: Clear what an earlier run left on a self-hosted runner
        if: runner.environment == 'self-hosted'
        env:
          VERSION: ${{ inputs.version }}
          OS: ${{ matrix.os }}
        run: rm -rf "release-output/$VERSION/$OS" "release-output/$VERSION/.work-$OS" release-output/*-nightly.*

      # A release passes the release pair as PEM text; a nightly passes no
      # secret, its key files come from the throwaway step.
      - name: Build the package
        working-directory: src
        env:
          PURPOSE: ${{ inputs.purpose }}
          VERSION: ${{ inputs.version }}
          EXPIRES: ${{ inputs.expires }}
          TIMON_RELEASE_PRIVATE_KEY: ${{ secrets.TIMON_RELEASE_PRIVATE_KEY }}
          TIMON_RELEASE_PUBLIC_KEY: ${{ secrets.TIMON_RELEASE_PUBLIC_KEY }}
        run: |
          if [ "$PURPOSE" = release ]; then
            node scripts/release/build-package.mjs --version "$VERSION" --channel stable --no-expiry --output ../release-output
          else
            node scripts/release/build-package.mjs --version "$VERSION" --channel beta --expires "$EXPIRES" --output ../release-output
          fi

      # node:path rather than dirname: the variable holds a Windows path on
      # the Windows runner.
      - name: Remove the throwaway keys
        if: always() && inputs.purpose == 'nightly'
        run: |
          node -e 'const f = process.env.TIMON_RELEASE_PRIVATE_KEY_FILE; if (f) require("node:fs").rmSync(require("node:path").dirname(f), { recursive: true, force: true });'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timon-${{ inputs.version }}-${{ matrix.os }}
          path: release-output/${{ inputs.version }}/${{ matrix.os }}/
          if-no-files-found: error
          # A release: an approval waits 30 days at most. A nightly: 3 days.
          retention-days: ${{ inputs.retention-days }}
          # Installers are already compressed.
          compression-level: 0
