# Builds a release candidate for Linux, macOS and Windows, on demand (Actions
# tab, "Run workflow"), and publishes nothing: the installers stay this run's
# artifacts, with their SHA-256 sums, their build summary and a build
# provenance attestation.
#
# Nothing here can publish. No secret is read: the daemon inside each package
# is signed with an Ed25519 pair made on the runner for each job
# (scripts/release/throwaway-keys.mjs, written under RUNNER_TEMP, owner-only,
# never printed). The package embeds the public half (release-public-key.pem
# in app.asar, and in the sealed dist/boot.js), so its shell and its daemon
# check themselves and it starts.
#
# Known limit: such a release candidate is NOT signed with the release key. It
# is not a trusted build and must never be published: rebuild with the release
# key for that. It still takes a published update, which its daemon checks
# against the keyring compiled into it (plugins-bundled/updates/keyring.ts),
# and the installer of that update replaces the shell and the daemon together,
# each with its own key.
#
# No token reaches the build: scripts/release/build-package.mjs passes
# `--publish never` to electron-builder, and the checkouts keep no credential.
# The only write permissions are the attestation's, on the attest jobs, which
# run no checkout, no npm and none of the built code: the build jobs run
# hundreds of dependency scripts, and an OIDC token within their reach would
# let any of them attest a digest of its choosing. The attest jobs take the
# uploaded installers and check them against the SHA256SUMS their build wrote
# before attesting them. The provenance attestation names the commit this
# workflow runs from; with another `ref`, the commit actually built is the one
# in build-summary.json.
#
# Every input is read through an environment variable, never pasted into a
# script: `${{ }}` inside `run:` would turn an input into shell code.
name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release candidate version, x.y.z-rc.N, above the version the ref carries (e.g. 0.1.9-rc.1)
        required: true
        type: string
      ref:
        description: Branch, tag or full sha to build. Empty builds the commit this workflow runs from, the only one the provenance attestation names.
        required: false
        type: string
        default: ''
      channel:
        description: Update channel written into the build
        required: true
        type: choice
        options: [beta, stable]
        default: beta
      expires:
        description: Expiry, an ISO 8601 date (2027-03-31, or a time with Z). Empty means 90 days from now; "never" is refused on beta.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rc-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # A minute on one runner refuses a bad request before three runners spend an
  # hour each on it, and pins what the three builds share: the commit (a branch
  # may move while they run), the expiry and the Node version.
  validate:
    name: validate the request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      node: ${{ steps.pin.outputs.node }}
      expires: ${{ steps.expiry.outputs.expires }}
    steps:
      - name: Check the version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.[1-9][0-9]*$ ]]; then
            echo "::error::version must be x.y.z-rc.N (N >= 1): this workflow builds release candidates only"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      - name: Pin the commit and the Node version
        id: pin
        shell: bash
        working-directory: src
        run: |
          if [ ! -f scripts/release/build-package.mjs ]; then
            echo "::error::this ref has no scripts/release/build-package.mjs: it predates the automated release build"
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          # The Node the packaged daemon runs on: native modules compiled by
          # npm ci must match its ABI.
          node=$(jq -r .version desktop/scripts/node-runtime.json)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected commit id"; exit 1; }
          [[ "$node" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected Node version in desktop/scripts/node-runtime.json"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "Building $sha with Node $node"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pin.outputs.node }}
          package-manager-cache: false

      # Computed once so the three systems carry the same expiry, not three
      # that differ by their build times.
      - name: Resolve the expiry
        id: expiry
        shell: bash
        working-directory: src
        env:
          CHANNEL: ${{ inputs.channel }}
          EXPIRES: ${{ inputs.expires }}
        run: |
          expires=$(node --input-type=module -e '
            const { createBuildInfo } = await import(process.argv[1]);
            const raw = process.env.EXPIRES.trim();
            const info = createBuildInfo({ channel: process.env.CHANNEL, expires: raw && raw !== "never" ? raw : undefined, noExpiry: raw === "never" });
            console.log(info.expiresAt ?? "never");
          ' "$PWD/desktop/scripts/build-info.mjs")
          echo "expires=$expires" >> "$GITHUB_OUTPUT"
          echo "Expires: $expires"

      # The dry run checks the keys exist like the real one does.
      - name: Throwaway signing keys
        shell: bash
        run: node src/scripts/release/throwaway-keys.mjs "$RUNNER_TEMP"

      # Refuses what the builds would refuse an hour later: a version not above
      # the ref's, package versions that disagree, an expiry the channel forbids.
      - name: Dry run of the package build
        shell: bash
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          EXPIRES: ${{ steps.expiry.outputs.expires }}
        run: |
          args=(--version "$VERSION" --channel "$CHANNEL" --output ../rc-output --dry-run)
          if [ "$EXPIRES" = never ]; then args+=(--no-expiry); else args+=(--expires "$EXPIRES"); fi
          node scripts/release/build-package.mjs "${args[@]}"

  build:
    name: build · ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # macOS: Apple Silicon only, as the maintainers' build host
        # (docs/internal/scripts/build-all.mjs builds one mac package, for the
        # host's architecture).
        include:
          # Pinned: Ubuntu 26.04 builds its musl for x86-64-v3, and the fence
          # launcher must run on a baseline x86-64 CPU (24.04 musl is baseline).
          - { os: linux, runner: ubuntu-24.04 }
          # macOS builds run on the project's own Mac (org runner group
          # `release-mac`, open to this workflow on main only): hosted
          # macOS arm64 runners were not acquired under capacity limits.
          - { os: mac, runner: [self-hosted, macOS, ARM64, timon-release] }
          - { os: windows, runner: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          path: src
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.validate.outputs.node }}
          cache: npm
          cache-dependency-path: |
            src/orchestrator/package-lock.json
            src/app/package-lock.json
            src/desktop/package-lock.json

      - name: Throwaway signing keys
        shell: bash
        run: node src/scripts/release/throwaway-keys.mjs "$RUNNER_TEMP"

      # The fence launcher is a static binary: built against the runner's glibc it
      # carries that libc's AVX code paths and dies with SIGILL on CPUs without
      # AVX2. musl targets the x86-64 baseline; its compiler only needs the
      # kernel's headers (Landlock, seccomp) made visible.
      - name: Install a baseline C library for the fence launcher
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools linux-libc-dev binutils
          musl_include=/usr/include/x86_64-linux-musl
          sudo ln -sfn /usr/include/linux "$musl_include/linux"
          sudo ln -sfn /usr/include/asm-generic "$musl_include/asm-generic"
          sudo ln -sfn /usr/include/x86_64-linux-gnu/asm "$musl_include/asm"
          x86_64-linux-musl-gcc --version | head -n 1

      # What the Linux build calls by name, checked before an hour of build:
      # objdump for the baseline check of the fence launcher, the compilers,
      # docker for the native modules rebuilt in the manylinux image. A runner
      # image that drops one fails here, in a second. Same step as
      # build-packages.yml, which release.yml and nightly.yml use.
      - name: Check the Linux build tools
        if: matrix.os == 'linux'
        run: for tool in objdump gcc x86_64-linux-musl-gcc docker; do command -v "$tool" >/dev/null || { echo "::error::$tool is missing on this runner"; exit 1; }; done

      # A self-hosted runner (the Mac) keeps its workspace between runs, and the
      # build never overwrites installers: a run started again for the same
      # version would stop on the output of the one before. Hosted runners
      # start empty. Only this version and this system are cleared.
      - name: Clear what an earlier run left on a self-hosted runner
        if: runner.environment == 'self-hosted'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          OS: ${{ matrix.os }}
        run: rm -rf "rc-output/$VERSION/$OS" "rc-output/$VERSION/.work-$OS"

      - name: Build the package
        shell: bash
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          EXPIRES: ${{ needs.validate.outputs.expires }}
        run: |
          args=(--version "$VERSION" --channel "$CHANNEL" --output ../rc-output)
          if [ "$EXPIRES" = never ]; then args+=(--no-expiry); else args+=(--expires "$EXPIRES"); fi
          node scripts/release/build-package.mjs "${args[@]}"

      # node:path rather than dirname: the variable holds a Windows path on
      # the Windows runner.
      - name: Remove the throwaway keys
        if: always()
        shell: bash
        run: |
          node -e 'const f = process.env.TIMON_RELEASE_PRIVATE_KEY_FILE; if (f) require("node:fs").rmSync(require("node:path").dirname(f), { recursive: true, force: true });'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timon-${{ inputs.version }}-${{ matrix.os }}
          path: rc-output/${{ inputs.version }}/${{ matrix.os }}/
          if-no-files-found: error
          retention-days: 30
          # Installers are already compressed.
          compression-level: 0

      # A small artifact of its own, so the recap does not download every installer.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc-summary-${{ matrix.os }}
          path: |
            rc-output/${{ inputs.version }}/${{ matrix.os }}/build-summary.json
            rc-output/${{ inputs.version }}/${{ matrix.os }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # Apart from the build: the OIDC token that signs the attestation never
  # shares a job with npm or the built code. One job per system, so a system
  # whose build failed leaves the others attested.
  attest:
    name: attest · ${{ matrix.os }}
    needs: [validate, build]
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [linux, mac, windows]
    steps:
      # Missing when this system's build failed: the job then ends without
      # attesting, and the recap reports the system as absent.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        continue-on-error: true
        with:
          name: timon-${{ inputs.version }}-${{ matrix.os }}
          path: installers

      # Attests only what the build listed and hashed: a file the sums do not
      # name, or one that does not match them, stops the attestation.
      - name: Check the installers against their sums
        if: ${{ steps.download.outcome == 'success' }}
        shell: bash
        working-directory: installers
        run: |
          [ -s SHA256SUMS ] || { echo "::error::no SHA256SUMS in the artifact"; exit 1; }
          sha256sum --strict -c SHA256SUMS
          # 64 hex digits and two spaces, then the name (which may hold spaces).
          listed=$(cut -c67- SHA256SUMS | sort)
          present=$(find . -type f ! -name SHA256SUMS ! -name build-summary.json | sed 's|^\./||' | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::the artifact and its SHA256SUMS do not name the same files"
            diff <(echo "$listed") <(echo "$present") || true
            exit 1
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ steps.download.outcome == 'success' }}
        with:
          subject-path: |
            installers/*
            !installers/SHA256SUMS
            !installers/build-summary.json
          create-storage-record: false

  summary:
    name: recap
    needs: [validate, build, attest]
    # Also after a failed system: the recap says which ones arrived.
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The recap script, from the commit this workflow runs from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            desktop/scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.validate.outputs.node }}
          package-manager-cache: false

      # Tolerated: with every build failed there is nothing to download, and
      # the recap still says so.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: rc-summary-*
          path: summaries

      - name: Write the recap
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ needs.validate.outputs.sha }}
        run: |
          mkdir -p summaries
          node tools/scripts/release/rc-summary.mjs summaries --version "$VERSION" --commit "$COMMIT"
